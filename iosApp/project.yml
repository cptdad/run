# THE PBXPROJ IS AUTHORITATIVE. This file drifted
# from it — it declared iOS 18.0 while the project actually builds with
# IPHONEOS_DEPLOYMENT_TARGET = 16.0 — so the natural reflex of running
# `xcodegen generate` would have silently raised the minimum OS by two major
# versions (cutting off every iPhone that cannot run 18) and rewritten other
# drifted settings with it. The value below is now reconciled with the pbxproj.
#
# Do NOT run `xcodegen generate` casually: the Xcode project carries hand-made
# changes (target membership for files added in Xcode, signing, the vendored
# tor.xcframework wiring). If you ever do regenerate, diff the result against
# the committed pbxproj before accepting it.
#
# l10n (scripts/l10n/gen-l10n.mjs): Localizable.xcstrings, InfoPlist.xcstrings,
# and L10n.swift are also hand-wired into the pbxproj (file refs, build-file
# entries, group/phase membership, knownRegions) — not generated by this file.
name: iosApp
options:
  bundleIdPrefix: com.vg
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"

# Tor: vendored Tor.framework (iCepa, built from source — Tor 0.4.9.13).
# The Objective-C wrapper sources live in iosApp/Tor/ (compiled into the app
# via the Run-Bridging-Header.h); the static C library is linked from
# Frameworks/tor.xcframework. SwiftTor (frozen on EOL Tor 0.4.4.6) was removed.
packages:
  SQLCipher:
    url: https://github.com/skiptools/swift-sqlcipher.git
    from: "1.8.0"

targets:
  Run:
    type: application
    platform: iOS
    sources:
      - iosApp
      - Tor
    dependencies:
      - framework: Frameworks/tor.xcframework
        embed: true
      - package: SQLCipher
        product: SQLCipher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vg.run
        INFOPLIST_FILE: iosApp/Info.plist
        # App-wide default file protection = NSFileProtectionComplete.
        CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.entitlements
        DEVELOPMENT_TEAM: YOUR_TEAM_ID
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: "Tor/Run-Bridging-Header.h"
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
          - "$(SRCROOT)/Frameworks"
        # Tor/libevent headers via -isystem so their upstream -Wdocumentation /
        # -Wquoted-include-in-framework-header warnings are suppressed without
        # disabling those checks for our own code.
        SYSTEM_HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/Frameworks/tor.xcframework/ios-arm64/Tor.framework/Headers"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "shared"
          - "-lz"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    preBuildScripts:
      - name: "Build Kotlin Framework"
        script: |
          # Resolve a JDK 17 for the Gradle build WITHOUT ever pointing
          # JAVA_HOME at a path that doesn't exist (the old brew fallback
          # did, breaking Xcode Cloud). On Xcode Cloud, ci_post_clone.sh
          # downloads Azul Zulu to $HOME/zulu-jdk17; locally, prefer an
          # already-set / registered / Homebrew JDK.
          if [ -x "$JAVA_HOME/bin/java" ]; then :
          elif [ -x "$HOME/zulu-jdk17/Contents/Home/bin/java" ]; then export JAVA_HOME="$HOME/zulu-jdk17/Contents/Home"
          elif J=$(/usr/libexec/java_home -v 17 2>/dev/null || /usr/libexec/java_home 2>/dev/null) && [ -x "$J/bin/java" ]; then export JAVA_HOME="$J"
          elif [ -x "/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home/bin/java" ]; then export JAVA_HOME="/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home"
          elif [ -x "/usr/local/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home/bin/java" ]; then export JAVA_HOME="/usr/local/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home"
          fi
          if [ ! -x "$JAVA_HOME/bin/java" ]; then echo "ERROR: no JDK 17 found for Kotlin framework build (JAVA_HOME='$JAVA_HOME')"; exit 1; fi
          export PATH="$JAVA_HOME/bin:$PATH"
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
        inputFiles:
          - "$(SRCROOT)/../shared/src/commonMain"
          - "$(SRCROOT)/../shared/src/iosMain"
        outputFiles:
          - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)/shared.framework"
        basedOnDependencyAnalysis: false

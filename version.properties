# Unified app version — single source of truth for BOTH Android and iOS.
#
# versionName: the marketing version (Android versionName /
#   iOS CFBundleShortVersionString). The PATCH (third number) is auto-
#   incremented on every `git push` by .githooks/pre-push. The MAJOR and
#   MINOR (first and second numbers) are bumped MANUALLY by editing this file.
#
# versionCode: a monotonic build number (Android versionCode /
#   iOS CFBundleVersion), auto-incremented on every push. Must never decrease.
#
# Android reads this file directly at build time. iOS reads its Info.plist,
# which the pre-push hook keeps in sync with the values here.
versionName=1.6.60
versionCode=1053

Summary: Anonymous, end-to-end encrypted messenger over Tor with no accounts or traces
Description: |-
  Rún is a secure messenger built for people who refuse to compromise on
  privacy. Every message is end-to-end encrypted before it leaves your device,
  and the keys ratchet forward as you chat.

  Rún requires no account, no phone number, and no email address. Contacts are
  added in person by scanning QR codes, or through a vouched introduction from
  someone you already trust: no central directory, no contact discovery, no
  social graph.

  All traffic is routed through the Tor network, hiding your IP address and
  location even from Rún's own relay. Messages are padded to fixed sizes, live
  in memory only and are never written to disk. The relay stores only
  temporary encrypted blobs it cannot read.

  Your vault is encrypted at rest with AES-256 via SQLCipher, its key derived
  with Argon2id and backed by the Android Keystore, with three protection
  levels (Decent, Secure, Maximum). Rún locks itself when idle, wipes after too
  many wrong unlock attempts, and self-destructs after a long stretch of
  inactivity.

  No analytics, no tracking, no advertising, no crash reporting, no cloud
  backups. This build contains no Google code: notifications, if you turn them
  on, arrive through a UnifiedPush distributor app you choose.

  The relay server's source is not published yet (hence NonFreeNet).


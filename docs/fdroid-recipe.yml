# fdroiddata metadata/com.vg.run.yml — the file to submit. Everything about the submission
# (steps, merge-request text, reviewer questions, per-release maintenance) is in
# docs/fdroid-submission.md. First tag with a signed release asset: v1.6.60 (2026-11-08).
# Field order is `fdroid rewritemeta` canonical; `fdroid lint` passes against fdroiddata's own
# category/anti-feature definitions (2026-11-08). The ndk value is the REVISION form because
# fdroidserver installs NDKs with sdkmanager "ndk;<value>" and its release-name table ends at r26c.
# No Summary/Description here: fdroiddata reads them (and the changelogs) from the repo's
# fastlane/metadata/android/<locale>/ tree at the build commit (public since v1.6.62). The
# `commit` is the full hash of the public tag (`git ls-remote git@github.com:cptdad/run.git
# 'refs/tags/vX^{}'`) — fdroiddata's checklist refuses tags/branches there.
AntiFeatures:
  - NonFreeAssets
  - NonFreeNet
Categories:
  - Internet
  - Security
License: GPL-3.0-or-later
AuthorName: Cpt Dad
AuthorEmail: cptdad12@proton.me
WebSite: https://vgab.eu
SourceCode: https://github.com/cptdad/run
IssueTracker: https://github.com/cptdad/run/issues
Changelog: https://github.com/cptdad/run/releases

RepoType: git
Repo: https://github.com/cptdad/run.git
Binaries: https://github.com/cptdad/run/releases/download/v%v/run-%v-foss.apk

Builds:
  - versionName: 1.6.62
    versionCode: 1055
    commit: 64dee175a8213f5619ad2def85eb7adf7b437f0c
    subdir: androidApp
    sudo:
      - apt-get update || apt-get update
      - apt-get install -y --no-install-recommends cmake ninja-build
    gradle:
      - foss
    prebuild:
      - cp ../relay.properties.example ../relay.properties
      - printf 'run.ndkPath=%s\n' "$$NDK$$" >> ../local.properties
    scandelete:
      - e2e-tests
      - iosApp/Frameworks/tor.xcframework
    ndk: 30.0.16248370

AllowedAPKSigningKeys: 29b4d5195bbc4ffd9be87c2547ee33371c7edff46f14ba8f93eadd7e2d2d2422

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v\d+\.\d+\.\d+$
UpdateCheckData: version.properties|versionCode=(\d+)|.|versionName=([\d.]+)
CurrentVersion: 1.6.62
CurrentVersionCode: 1055

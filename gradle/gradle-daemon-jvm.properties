# Daemon JVM criteria.
#
# Pinned to JDK 17 — the SAME JDK that iosApp/ci_scripts/ci_post_clone.sh installs
# and hash-verifies — so Xcode Cloud (and local builds) run Gradle on it with NO
# toolchain download. We deliberately DO NOT list foojay `toolchainUrl.*`
# endpoints (an unpinned, un-checksummed download of the JVM that compiles all the
# crypto is a supply-chain risk) and `org.gradle.java.installations.auto-download
# =false` (gradle.properties) keeps it that way: Gradle resolves a LOCALLY
# INSTALLED JDK 17 and never fetches one.
#
# JDK 17 is the canonical Android build JDK and the JdkImageTransform works on it;
# a too-NEW JDK (e.g. 26) is what breaks that transform. To build locally, install
# a JDK 17 (e.g. Temurin 17); otherwise the build fails closed with a clear
# "no compatible toolchains" message instead of fetching one.
toolchainVersion=17

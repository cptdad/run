[versions]
agp = "9.4.0"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.4.20"
composeBom = "2026.09.00"
billing = "9.1.0"
googleServices = "4.5.0"
unifiedpush = "3.3.5"
playReview = "2.0.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
billing-ktx = { group = "com.android.billingclient", name = "billing-ktx", version.ref = "billing" }
# Play In-App Review — the privacy-respecting store-review nudge
# (ReviewPromptPolicy.kt in commonMain decides WHEN; this is only the
# platform call). 2.0.2 is the latest 2.x release (checked against
# dl.google.com's maven-metadata.xml). On devices without Play Services (or
# an install not from Play) `requestReviewFlow()`'s Task simply fails and the
# caller no-ops — never a custom dialog, never a browser fallback.
play-review-ktx = { group = "com.google.android.play", name = "review-ktx", version.ref = "playReview" }
# UnifiedPush connector — the Google-free background-notification transport
# (a distributor app such as ntfy holds the socket and wakes Rún). Apache-2.0,
# no Google transitives, so it lives in the MAIN source set and ships in BOTH
# flavors — `foss` stays a zero-Google build.
unifiedpush-connector = { group = "org.unifiedpush.android", name = "connector", version.ref = "unifiedpush" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# FCM vendor-push tier (`google` build flavor only — notification-levels-plan.md
# §2b). Classpath-resolved here (root build.gradle.kts, `apply false`) and
# applied unconditionally in androidApp/build.gradle.kts, which sets
# missingGoogleServicesStrategy = IGNORE so the `foss` flavor (no
# google-services.json, by design) doesn't fail the build — see the comment
# there for why a task-name-string guard was wrong.
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }

